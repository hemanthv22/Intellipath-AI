<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - IntelliPath</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="auth-left">
            <a href="index.html" class="logo">Intelli<span>Path</span></a>
            <div>
                <h1>Unlock Your<br>Career Potential</h1>
                <p>Join thousands of students using AI to build ATS-friendly resumes and discover their perfect career
                    roadmap.</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h2>Create an account</h2>
                    <p>Start your AI-guided career journey today.</p>
                </div>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" class="form-control" placeholder="john@university.edu"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" class="form-control"
                            placeholder="Create a strong password" required oninput="checkPasswordStrength(this.value)">
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('signupPassword', this)"></i>
                        <div class="strength-meter" id="strengthMeterContainer">
                            <div class="strength-meter-fill" id="strengthMeterFill"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupCollege">College / University</label>
                        <input type="text" id="signupCollege" class="form-control" placeholder="Enter your college name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="signupBranch">Branch / Major</label>
                        <input type="text" id="signupBranch" class="form-control" placeholder="e.g., Computer Science"
                            required>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;" id="signupBtn">Create
                        Account</button>
                </form>

                <div class="switch-form-text">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
